# 上流（zsviczian/excalibrain）から引き継いだ CodeQL。v1 の codeql-action は停止済みなので
# 現行の v3 と javascript-typescript に更新した。既定ブランチ（main）と PR、週 1 回のスケジュールで走る。
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "38 14 * * 4"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
